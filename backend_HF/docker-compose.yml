version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technician_backend
    restart: always
    volumes:
      - sqlite_data:/app/database_data
      - static_volume:/app/static
    environment:
      - PORT=8000
      - DB_PATH=/app/database_data/technician_assistant.db
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: technician_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
    depends_on:
      - backend

volumes:
  sqlite_data:
  static_volume:
